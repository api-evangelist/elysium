constraints:
- Checkout requires contemporaneous human approval; agents must not complete payment without explicit
  buyer consent (provider-published rule in /llms.txt).
- The site robots.txt declares "Checkouts are for humans" and disallows end-to-end buy-for-me flows
  that complete payment without a final human review step.
- The MCP endpoint is rate-limited per IP; back off on 429.
- Agents should pass `context.address_country` and `context.currency` for accurate pricing.
