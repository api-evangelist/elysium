apis:
- aid: elysium-ucp-shopping
  name: Elysium Health UCP Shopping (Agentic Commerce)
  description: >-
    Elysium Health's storefront implements the Universal Commerce Protocol (UCP) for agent-driven
    commerce, discoverable at https://www.elysiumhealth.com/.well-known/ucp. The merchant profile
    advertises the dev.ucp.shopping service over an MCP transport, with capabilities for catalog
    search and lookup, cart, checkout, fulfillment, discount, and order, plus the Shopify catalog
    extension and registered payment handlers. Supported protocol versions are 2026-04-08 (latest
    stable) and 2026-01-23. The store's published agent policy requires contemporaneous human
    approval before any payment is completed.
  humanURL: https://www.elysiumhealth.com/llms.txt
  baseURL: https://www.elysiumhealth.com/api/ucp/mcp
  tags:
  - Agentic Commerce
  - UCP
  - MCP
  - Shopping
  properties:
  - type: WellKnown
    url: well-known/elysium-well-known.yml
  - type: MCPServer
    url: mcp/elysium-mcp.yml
- aid: elysium-customer-account
  name: Elysium Health Customer Account (Shopify OIDC)
  description: >-
    Shopify Customer Accounts identity surface for elysiumhealth.com. OpenID Connect discovery is
    published at https://www.elysiumhealth.com/.well-known/openid-configuration (and mirrored at
    /.well-known/oauth-authorization-server, RFC 8414), issued by
    https://shopify.com/authentication/26818117694 with authorization, token, logout, and JWKS
    endpoints on account.elysiumhealth.com. Authorization code with PKCE (S256), refresh_token, and
    JWT bearer grants are supported; scopes are openid, email, customer-account-api:full, and
    customer-account-mcp-api:full.
  humanURL: https://www.elysiumhealth.com/.well-known/openid-configuration
  baseURL: https://account.elysiumhealth.com/authentication
  tags:
  - Authentication
  - OpenID Connect
  - OAuth
  - Customer Accounts
  properties:
  - type: OpenIDConnect
    url: well-known/elysium-openid-configuration.json
  - type: OAuthScopes
    url: scopes/elysium-scopes.yml
- aid: elysium-storefront-json
  name: Elysium Health Storefront Product JSON
  description: >-
    Read-only, unauthenticated storefront data endpoints published in Elysium Health's agent policy:
    product listings at /products.json, per-product JSON at /products/{handle}.json, collection
    listings at /collections/{handle}/products.json, and site search at /search?q={query}&type=product.
    Eleven products are currently listed, spanning cellular, cognitive, immune, metabolic, skin, eye,
    and muscle aging plus the Index biological-age test.
  humanURL: https://www.elysiumhealth.com/collections/all
  baseURL: https://www.elysiumhealth.com/products.json
  tags:
  - Products
  - Catalog
  - Storefront
