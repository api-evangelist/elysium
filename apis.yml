aid: elysium
name: Elysium Health
description: >-
  Elysium Health is a New York-based consumer longevity and healthspan company founded in 2014 by MIT
  biologist Leonard Guarente, Eric Marcotulli, and Dan Alminana, and backed by General Catalyst since
  2016. It translates academic aging research into direct-to-consumer supplements and diagnostics —
  Basis (NAD+ / nicotinamide riboside plus pterostilbene), Matter, Signal, Format, Mosaic, Cofactor,
  Vision, Senolytic Complex, Creatine+, and the Index biological-age epigenetic test — supported by a
  scientific advisory board that includes multiple Nobel laureates and by academic partnerships and
  clinical trials published through its Aging Research Center. Elysium publishes no traditional
  developer API program; its machine-readable surface is an agent-facing commerce stack on Shopify —
  a Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, a UCP MCP endpoint, a
  published llms.txt / agents.md agent policy, Shopify Customer Account OIDC discovery, and the
  storefront product/collection JSON endpoints.
